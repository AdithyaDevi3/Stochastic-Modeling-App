apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-markov
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: weather-markov.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: weather-markov
            port:
              number: 80
